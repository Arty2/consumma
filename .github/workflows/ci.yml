name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing deploys from Actions. Vercel's Git integration handles previews and
# production; this workflow only decides whether a change is allowed to land.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Gates
        run: pnpm run gates

      - name: Types
        run: pnpm run check

      - name: Lint
        run: pnpm run lint

      - name: Unit and property tests
        run: pnpm run test:unit --run

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm run test:e2e

      - name: Build
        run: pnpm run build

      - name: Bundle budget
        run: pnpm run budget

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
