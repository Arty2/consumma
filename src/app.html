<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />

		<!--
			White, not black: a black toolbar tint would break the sheet-of-paper
			illusion at exactly the moment the app opens.
		-->
		<meta name="theme-color" content="#ffffff" />
		<link rel="manifest" href="/manifest.webmanifest" />

		<!-- iOS has no install prompt; it is Share → Add to Home Screen. -->
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="/consumma" />

		<link rel="preload" href="/fonts/graphe-alpha.woff2" as="font" type="font/woff2" crossorigin />

		%sveltekit.head%
	</head>
	<body>
		<div>%sveltekit.body%</div>
	</body>
</html>
